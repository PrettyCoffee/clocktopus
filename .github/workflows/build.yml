name: Validate, build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # Allows to run this workflow manually

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # build:release needs full history to create multiple builds:
      # 1. dev build based on current main branch state
      # 2. prod build based on latest tag
      - name: Checkout with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v3.0.0
        with:
          version: 11.26.0
          runtime: node@24.21.0
          install: true
          require-lockfile: true

      - name: Run linter
        run: pnpm run lint

      - name: Run knip
        run: pnpm run knip:ci

      - name: Build project
        run: pnpm run build:release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
